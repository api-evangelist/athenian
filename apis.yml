aid: athenian
name: Athenian
description: >-
  Athenian was a full-cycle software-development analytics platform founded in 2019 by
  Eiso Kant, with a seed round led by Point Nine. It integrated GitHub, JIRA, and CI/CD
  tooling to give engineering leaders end-to-end visibility into their delivery pipeline —
  lead time, cycle time, deployment frequency, PR review dynamics, and goal alignment —
  deliberately measuring teams and events rather than ranking individuals. The company has
  since wound down: athenian.com and athenian.co now redirect to github.com/athenianco and
  the production API host api.athenian.co no longer resolves. However, the OpenAPI
  specification (athenianco/api-spec, 79 operations, 218 schemas) and the open-source API
  implementation (athenian-api-open, MIT) remain publicly published on GitHub, which is why
  this profile is enriched from the real, still-available API contract.
