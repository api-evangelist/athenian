        date_to:
          description: Search for the deployments until this date.
          format: date
          type: string
        timezone:
          $ref: '#/components/schemas/TimeZone'
        account:
          description: Session account ID.
          type: integer
        in:
          $ref: '#/components/schemas/RepositorySet'
        with:
          $ref: '#/components/schemas/DeploymentWith'
        pr_labels_include:
          description: At least one of these labels must be present in at least one deployed PR.
          items:
            type: string
          type: array
        pr_labels_exclude:
          description: None of these labels must be present in each deployed PR.
          items:
            type: string
          type: array
        jira:
          $ref: '#/components/schemas/JIRAFilter'
        environments:
          description: Deployments must belong to one of these environments.
          items:
            type: string
          type: array
        conclusions:
          description: Deployments must execute with any of these conclusions.
          items:
            $ref: '#/components/schemas/DeploymentConclusion'
          type: array
        with_labels:
          description: Deployments should contain at least one of the specified label values. `null` matches any label value and effectively checks the label existence.
          type: object
        without_labels:
          description: Deployments may not contain the specified label values. `null` matches any label value and effectively ensures that the label does not exist.
          type: object
      required:
